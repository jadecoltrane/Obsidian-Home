<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="760" viewBox="0 0 1504 760" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">知识检索与概念网络</title><desc id="desc">概念枢纽组织笔记，别名扩展查询，中文二元组与英文分词经 BM25 排序后返回来源</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#726e66" stroke-width="1.3"/></marker></defs><rect width="1504" height="760" fill="#f4f2ed"/><text x="64" y="70" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="38" fill="#292824" font-weight="600">从一个概念，找到相关的原始笔记</text><text x="1440" y="70" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#726e66" text-anchor="end">检索机制</text><path d="M64 98H1440" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="64" y="153" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#8a654a" font-weight="600">01  概念组织</text><text x="787" y="153" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#8a654a" font-weight="600">02  查询流程</text><path d="M746 136V649" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><path d="M365 378L153 285" fill="none" stroke="#a5a096" stroke-width="1.7"/><circle cx="153" cy="285" r="7" fill="#8a654a"/><text x="153" y="261" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#292824" text-anchor="middle">笔记 A</text><path d="M365 378L582 250" fill="none" stroke="#a5a096" stroke-width="1.7"/><circle cx="582" cy="250" r="7" fill="#8a654a"/><text x="582" y="226" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#292824" text-anchor="middle">笔记 B</text><path d="M365 378L153 484" fill="none" stroke="#a5a096" stroke-width="1.7"/><circle cx="153" cy="484" r="7" fill="#8a654a"/><text x="153" y="523" font-family