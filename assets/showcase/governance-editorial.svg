<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="745" viewBox="0 0 1504 745" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">记忆治理与写入边界</title><desc id="desc">输入、分类、提交、维护及计划与事实的隔离，删除归档需要明确授权</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#726e66" stroke-width="1.3"/></marker></defs><rect width="1504" height="745" fill="#f4f2ed"/><text x="64" y="70" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="38" fill="#292824" font-weight="600">从写入到复核：记忆如何避免失真</text><text x="1440" y="70" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="20" fill="#726e66" text-anchor="end">数据治理</text><path d="M64 98H1440" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="64" y="164" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#8a654a">01</text><text x="64" y="219" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="40" fill="#292824" font-weight="600">输入</text><path d="M64 242H364" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="64" y="289" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">区分事实、观点</text><text x="64" y="329" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">与未来计划</text><path d="M369 211H406" fill="none" stroke="#726e66" stroke-width="1.5" marker-end="url(#arr)"/><text x="418" y="164" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#8a654a">02</text><text x="418" y="219" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="40" fill="#292824" font-weight="600">分类</text><path d="M418 242H718" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="418" y="289" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">画像、知识笔记</text><text x="418" y="329" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">按授权分别处理</text><path d="M723 211H760" fill="none" stroke="#726e66" stroke-width="1.5" marker-end="url(#arr)"/><text x="772" y="164" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#8a654a">03</text><text x="772" y="219" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="40" fill="#292824" font-weight="600">提交</text><path d="M772 242H1072" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="772" y="289" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">核对最新版本</text><text x="772" y="329" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">并发保护与校验</text><path d="M1077 211H1114" fill="none" stroke="#726e66" stroke-width="1.5" marker-end="url(#arr)"/><text x="1126" y="164" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="22" fill="#8a654a">04</text><text x="1126" y="219" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="40" fill="#292824" font-weight="600">维护</text><path d="M1126 242H1426" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="1126" y="289" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">去重候选、事实复核</text><text x="1126" y="329" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="25" fill="#726e66">概念关联与索引</text><path d="M64 394H1440" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><text x="64" y="456" font-family="'Noto Serif CJK SC','Songti SC','STSong','SimSun',serif" font-size="30" fill="#292824" font-weight="600">不可混淆的两类记录</text><text x="64" y="510" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" fill="#292824" font-weight="600">计划与意图</text><text x="64" y="551" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" fill="#726e66">可以调整，不代表已经发生</text><text x="756" y="510" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" fill="#292824" font-weight="600">已发生的事实</text><text x="756" y="551" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" fill="#726e66">来自真实记录，日记不参与自动合并</text><path d="M706 485V576" fill="none" stroke="#c7c1b6" stroke-width="1.5"/><rect x="64" y="622" width="1376" height="77" fill="#ded9ce"/><text x="87" y="671" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="27" fill="#292824" font-weight="600">删除与归档必须经过明确授权，人的判断优先于自动化。</text></svg>
