<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="820" viewBox="0 0 1504 820" role="img" aria-labelledby="title desc"><title id="title">Memory with governance</title><desc id="desc">Memory lifecycle including user consent, versioned data, retrieval, lint and periodic review; deletion and archive require approval.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#ab8061" stroke-width="1.3"/></marker></defs><rect width="1504" height="820" fill="#faf4ec"/><rect x="26" y="26" width="1452" height="768" fill="none" stroke="#c5a59c"/><rect x="26" y="26" width="1452" height="172" fill="#603e49"/><text x="78" y="77" font-size="19" fill="#ead0c3" font-family="Arial,sans-serif" letter-spacing="3">A PAGE OF EVERYDAY LIFE  /  SYSTEM NOTES 04</text><text x="76" y="139" font-size="50" fill="#fff1df" font-family="Georgia,serif">Memory with governance</text><text x="79" y="177" font-size="22" fill="#ead0c3" font-family="Arial,sans-serif">Capture, organize, revisit — and keep the human in control.</text><g transform="translate(1340 61)" stroke="#dcb6a5" stroke-width="1.5" fill="none"><path d="M0 89Q29 40 86 0M24 56Q-5 42 6 22Q28 23 34 46M43 36Q33 10 56 8Q69 27 51 36M46 48Q74 31 88 44Q71 65 53 56"/></g><rect x="78" y="270" width="252" height="215" rx="14" fill="#ead4cf" stroke="#c5a59c" stroke-width="1.5"/><text x="98" y="306" font-size="17" fill="#603e49" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2">01 / STEP</text><text x="98" y="356" font-size="34" fill="#382e32" font-family="Georgia,serif">Capture</text><text x="98" y="400" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Conversations</text><text x="98" y="431" font-size="21" fill="#79615e" font-family="Arial,sans-serif">User input</text><path d="M330 375H349" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="351" y="270" width="252" height="215" rx="14" fill="#fffaf3" stroke="#c5a59c" stroke-width="1.5"/><text x="371" y="306" font-size="17" fill="#603e49" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2">02 / STEP</text><text x="371" y="356" font-size="34" fill="#382e32" font-family="Georgia,serif">Classify</text><text x="371" y="400" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Profile / Notes</text><text x="371" y="431" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Consent boundaries</text><path d="M603 375H622" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="624" y="270" width="252" height="215" rx="14" fill="#fffaf3" stroke="#c5a59c" stroke-width="1.5"/><text x="644" y="306" font-size="17" fill="#603e49" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2">03 / STEP</text><text x="644" y="356" font-size="34" fill="#382e32" font-family="Georgia,serif">Persist</text><text x="644" y="400" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Markdown + Git</text><text x="644" y="431" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Version history</text><path d="M876 375H895" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="897" y="270" width="252" height="215" rx="14" fill="#fffaf3" stroke="#c5a59c" stroke-width="1.5"/><text x="917" y="306" font-size="17" fill="#603e49" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2">04 / STEP</text><text x="917" y="356" font-size="34" fill="#382e32" font-family="Georgia,serif">Retrieve</text><text x="917" y="400" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Index + concepts</text><text x="917" y="431" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Daily rediscovery</text><path d="M1149 375H1168" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1170" y="270" width="252" height="215" rx="14" fill="#ead4cf" stroke="#c5a59c" stroke-width="1.5"/><text x="1190" y="306" font-size="17" fill="#603e49" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2">05 / STEP</text><text x="1190" y="356" font-size="34" fill="#382e32" font-family="Georgia,serif">Review</text><text x="1190" y="400" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Lint + GC</text><text x="1190" y="431" font-size="21" fill="#79615e" font-family="Arial,sans-serif">Evidence checks</text><path d="M1296 485V530H752V565" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="399" y="565" width="706" height="122" rx="14" fill="#dce3d6" stroke="#c5a59c" stroke-width="1.5"/><text x="752" y="610" font-size="31" fill="#382e32" font-family="Georgia,serif" text-anchor="middle">Human decision boundary</text><text x="752" y="652" font-size="21" fill="#576957" font-family="Arial,sans-serif" text-anchor="middle">Explicit approval for deletion / archive; preserve original diary facts.</text><path d="M399 625H205V485" fill="none" stroke="#ab8061" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 8"/><path d="M78 742H1426" stroke="#c5a59c"/><text x="79" y="773" font-size="17" fill="#79615e" font-family="Georgia,serif" letter-spacing="2">PERSONAL MEMORY &amp; LIVING SYSTEM</text><text x="1426" y="773" font-size="17" fill="#79615e" font-family="Georgia,serif" text-anchor="end" letter-spacing="2">PLATE 04  /  SCHEMATIC</text></svg>